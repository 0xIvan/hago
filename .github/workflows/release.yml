name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-public
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HAGO_CODE_SIGN_IDENTITY: 'Developer ID Application: Ivan Hu Yu (AB879DAVK8)'
      HAGO_NOTARY_PROFILE: hago-release
      HAGO_ARCHS: arm64 x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release metadata and publication
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ && "$build" =~ ^[0-9]+$ ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Resources/Info.plist)" == com.ivan.hago ]]
          git merge-base --is-ancestor HEAD origin/main
          echo "HAGO_VERSION=$version" >> "$GITHUB_ENV"
          echo "HAGO_BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Tag must match bundle version.' >&2; exit 1; }
            if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/existing-release.json"; then
              python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1]))["isDraft"] else "Refusing to overwrite a published release.")' "$RUNNER_TEMP/existing-release.json"
            fi
            gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
            python3 - "$version" "$RUNNER_TEMP/published-tags" <<'PY'
          import pathlib,re,sys
          incoming=tuple(map(int,sys.argv[1].split('.')))
          tags=pathlib.Path(sys.argv[2]).read_text().splitlines()
          for tag in tags:
              if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag) and tuple(map(int,tag[1:].split('.'))) >= incoming:
                  sys.exit('Release version must exceed every published stable version.')
          PY
            gh release view --json assets --jq '.assets[].name' > "$RUNNER_TEMP/latest-asset-names"
            if grep -qx appcast.xml "$RUNNER_TEMP/latest-asset-names"; then
              gh release download --pattern appcast.xml --dir "$RUNNER_TEMP/previous-feed"
              python3 - "$build" "$RUNNER_TEMP/previous-feed/appcast.xml" <<'PY'
          import sys,xml.etree.ElementTree as ET
          versions=ET.parse(sys.argv[2]).findall('.//{http://www.andymatuschak.org/xml-namespaces/sparkle}version')
          assert versions, 'Published appcast has no build version'
          assert all(int(x.text) < int(sys.argv[1]) for x in versions), 'Build number must increase'
          PY
            fi
          fi
      - name: Validate signing secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD SPARKLE_PRIVATE_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing release secret: $name" >&2; exit 1; }
          done
      - name: Build and test
        run: swift test
      - name: Package universal app
        run: |
          scripts/package-app.sh release
          for architecture in arm64 x86_64; do lipo outputs/Hago.app/Contents/MacOS/Hago -verify_arch "$architecture"; done
      - name: Configure signing and notarization
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/hago-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/hago-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/hago-signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          curl --fail --silent --show-error --location https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$HAGO_NOTARY_PROFILE" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
      - name: Sign notarize and verify app and DMG
        run: |
          scripts/notarize-app.sh outputs/Hago.app outputs/notarization.zip
          scripts/package-dmg.sh outputs/Hago.app outputs
          dmg="outputs/Hago-$HAGO_VERSION-universal.dmg"
          xcrun notarytool submit "$dmg" --keychain-profile "$HAGO_NOTARY_PROFILE" --wait --output-format json > outputs/dmg-notarization.json
          python3 -c 'import json; assert json.load(open("outputs/dmg-notarization.json"))["status"] == "Accepted"'
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          hdiutil verify "$dmg"
      - name: Generate and verify signed Sparkle feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          scripts/appcast.sh outputs/Hago.app "outputs/Hago-$HAGO_VERSION-universal.dmg"
          cp "outputs/Hago-$HAGO_VERSION-universal.zip" outputs/Hago.app.zip
          (cd outputs && shasum -a 256 Hago-*.dmg Hago-*.zip Hago.app.zip appcast.xml > SHA256SUMS)
          (cd outputs && shasum -a 256 Hago.app.zip > Hago.app.zip.sha256)
      - name: Create draft release and attach verified downloads
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --json id > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Hago $HAGO_VERSION" --notes-file docs/release-notes.md
          fi
          gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/ready-draft"
          [[ "$(cat "$RUNNER_TEMP/ready-draft")" == true ]] || { echo 'Release is no longer a draft.' >&2; exit 1; }
          gh release upload "$GITHUB_REF_NAME" outputs/Hago-*.dmg outputs/Hago-*.zip outputs/Hago.app.zip outputs/Hago.app.zip.sha256 outputs/SHA256SUMS outputs/appcast.xml --clobber
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest=true
      - name: Save verified candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hago-${{ env.HAGO_VERSION }}-${{ env.HAGO_BUILD_NUMBER }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            outputs/Hago-*.dmg
            outputs/Hago-*.zip
            outputs/Hago.app.zip
            outputs/Hago.app.zip.sha256
            outputs/appcast.xml
            outputs/SHA256SUMS
            outputs/dmg-notarization.json
      - name: Remove signing material
        if: always()
        run: |
          keychain="$RUNNER_TEMP/hago-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/hago-signing.p12"
