name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version (e.g. 0.2.0)
        required: true
      build:
        description: Monotonically increasing bundle build number
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build notarized release candidate
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run tests
        run: swift test

      - name: Package app
        env:
          HAGO_VERSION: ${{ inputs.version || github.ref_name }}
          HAGO_BUILD_NUMBER: ${{ inputs.build }}
        run: |
          export HAGO_VERSION="${HAGO_VERSION#v}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            SOURCE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
            [[ "$HAGO_VERSION" == "$SOURCE_VERSION" ]] || { echo "Tag must match source bundle version." >&2; exit 1; }
          fi
          scripts/package-app.sh release

      - name: Validate signing secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=()

          [[ -n "$APPLE_CERTIFICATE_BASE64" ]] || missing+=("APPLE_CERTIFICATE_BASE64")
          [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]] || missing+=("APPLE_CERTIFICATE_PASSWORD")
          [[ -n "$APPLE_ID" ]] || missing+=("APPLE_ID")
          [[ -n "$APPLE_TEAM_ID" ]] || missing+=("APPLE_TEAM_ID")
          [[ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]] || missing+=("APPLE_APP_SPECIFIC_PASSWORD")

          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'Missing required release secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/hago-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk -F '"' '/Developer ID Application/ { print $2; exit }'
          )"

          if [[ -z "$SIGNING_IDENTITY" ]]; then
            echo "No Developer ID Application identity found in imported certificate." >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2
            exit 1
          fi

          echo "HAGO_CODE_SIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Sign and notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: scripts/notarize-app.sh outputs/Hago.app outputs/notarization.zip

      - name: Create distribution artifacts
        run: |
          scripts/package-dmg.sh outputs/Hago.app outputs
          DMG="$(find outputs -maxdepth 1 -name 'Hago-*.dmg' -print -quit)"
          RESULT="$(xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --output-format json)"
          STATUS="$(printf '%s' "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          [[ "$STATUS" == "Accepted" ]] || { echo "DMG notarization was not accepted: $STATUS" >&2; exit 1; }
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          (cd outputs && shasum -a 256 Hago-*.dmg Hago-*.zip > SHA256SUMS)
          cp outputs/SHA256SUMS "${DMG%.dmg}.sha256"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

      - name: Generate and verify signed appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo "SPARKLE_PRIVATE_KEY release secret is required." >&2; exit 1; }
          DMG="$(find outputs -maxdepth 1 -name 'Hago-*.dmg' -print -quit)"
          scripts/appcast.sh outputs/Hago.app "$DMG"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > outputs/release-notes.md <<EOF
          Download Hago-$VERSION-*.dmg, open it and drag Hago to Applications.
          This release is Developer ID signed and notarized.
          Check for Updates in Hago Settings uses the signed Sparkle appcast.
          EOF
          cp outputs/Hago-*.zip outputs/Hago.app.zip
          (cd outputs && shasum -a 256 Hago.app.zip > Hago.app.zip.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" outputs/Hago-*.dmg outputs/Hago-*.zip outputs/Hago.app.zip outputs/Hago.app.zip.sha256 outputs/SHA256SUMS outputs/appcast.xml
          else
            gh release create "$GITHUB_REF_NAME" outputs/Hago-*.dmg outputs/Hago-*.zip outputs/Hago.app.zip outputs/Hago.app.zip.sha256 outputs/SHA256SUMS outputs/appcast.xml --title "Hago $GITHUB_REF_NAME" --notes-file outputs/release-notes.md
          fi

      - name: Upload release candidate for local appcast signing and qualification
        uses: actions/upload-artifact@v4
        with:
          name: Hago-${{ inputs.version }}-${{ inputs.build }}
          path: |
            outputs/Hago-*.dmg
            outputs/Hago-*.zip
            outputs/SHA256SUMS
          if-no-files-found: error

      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/hago-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
